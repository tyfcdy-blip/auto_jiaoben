name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Prepare isolated Excel package dependencies
        run: |
          python -m venv .ci-excel-venv
          .ci-excel-venv/bin/python -m pip install -r examples/excel-sheet-merger/requirements.txt
      - run: ruff check backend agent tests deploy
      - run: pytest tests -q --junitxml=runtime/verification/ci-python.xml
        env:
          EXCEL_TEST_PYTHON: ${{ github.workspace }}/.ci-excel-venv/bin/python
      - name: Upload Python test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-test-report
          path: runtime/verification/ci-python.xml
          if-no-files-found: error
          retention-days: 14

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run format:check
      - run: npm run build
        env:
          VITE_BASE_PATH: /automation/

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build immutable amd64 image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: automation-workbench:ci
          build-args: |
            NODE_IMAGE=node@sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c
            PYTHON_IMAGE=python@sha256:392307d22300de8b5986851a12d9176dfc0fc073e65bf6523ebd7dcbeb23564e
            VITE_BASE_PATH=/automation/
            RELEASE_VERSION=ci
            VCS_REF=${{ github.sha }}
      - name: Verify image metadata and subpath
        run: >-
          python deploy/verify_release_image.py
          --image automation-workbench:ci
          --version ci
          --commit "${GITHUB_SHA}"
          --base-path /automation
      - name: Validate production Compose overlays
        env:
          WB_DATABASE_NETWORK: muyaju-data-reservoir_database
          WB_INGRESS_NETWORK: basic_basic_net
        run: >-
          docker compose --env-file deploy/.env.production.example
          -f deploy/compose.yaml
          -f deploy/compose.external-db.yaml
          -f deploy/compose.shared-nginx.yaml
          config --quiet
